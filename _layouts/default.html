<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="{{ site.theme_color | default: '#18171c' }}">
    <style>
      :root { color-scheme: dark; }
      html, body { background: #18171c; color: #e8e8e8; }
      body { margin: 0; }
    </style>
    {% capture seo_tags %}{% seo %}{% endcapture %}
    {{ seo_tags | replace: '<meta name="twitter:card" content="summary" />', '' }}
    {% include social-image-meta.html %}
    <link rel="icon" type="image/png" href="{{ site.logo | default: '/assets/img/avatar.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ site.logo | default: '/assets/img/avatar.png' | relative_url }}">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://s.ytimg.com">
    <link href="https://api.fontshare.com/v2/css?f[]=tanker@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@500;600;700&family=Roboto+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
    <script defer src="https://knowing-anteater.pikapod.net/script.js" data-website-id="69c577ca-bacf-49da-8edb-aeec2c382808"></script>
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    {% include header.html %}

    <main id="content" class="site-main">
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
