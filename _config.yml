title: alexx.fyi
description: Personal blog and pages for alexx.fyi
url: "https://alxndrrr.github.io"
baseurl: "/alexx.fyi"
lang: en

author:
  name: Alexx
  intro: "Hi, I am Alexx. This is my place for notes, small essays, projects, links, and the things I want to keep thinking about."
  email: "hello@example.com"
  threads: "https://www.threads.net/"

logo: "/assets/img/avatar.png"

theme_color: "#18171c"
accent_color: "#ff0073"

permalink: /blog/:year/:month/:day/:title/
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

nav:
  - title: Home
    url: /
  - title: Blog
    url: /blog/
  - title: About
    url: /about/
