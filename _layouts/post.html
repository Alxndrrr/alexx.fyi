---
layout: default
---

<article class="article article--post{% if page.type == 'micropost' %} article--micro{% endif %}">
  <header class="article__header">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d-%m-%Y" }}</time>
    {% unless page.type == "micropost" %}
      <h1>{{ page.title }}</h1>
    {% endunless %}
    {% if page.categories %}
      <ul class="tag-list" aria-label="Categories">
        {% for category in page.categories %}
          <li>{{ category }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </header>

  <div class="article__content">
    {{ content }}
  </div>
</article>
