---
layout: default
---

<header class="archive-header">
  <nav class="favorite-breadcrumb favorite-breadcrumb--page" aria-label="Breadcrumb">
    <h1>{{ page.title }}</h1>
    <span class="favorite-breadcrumb__slash" aria-hidden="true">/</span>
    <span class="favorite-breadcrumb__dots" aria-hidden="true">...</span>
  </nav>
</header>

<section class="archive-list" aria-label="Blog archive">
  {% assign posts_by_year = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
  {% for year in posts_by_year %}
    <section class="archive-year" aria-labelledby="archive-{{ year.name }}">
      <h2 id="archive-{{ year.name }}">{{ year.name }}</h2>
      <ul>
        {% for post in year.items %}
          <li>
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </section>
  {% endfor %}
</section>
