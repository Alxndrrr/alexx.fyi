title: alexx.fyi
description: Personal blog and pages for alexx.fyi
url: "https://www.alexx.fyi"
baseurl: ""
lang: en

author:
  name: Alex van der Weij
  email: "hi@alexx.fyi"
  threads: "https://www.threads.net/@alexx.fyi"

logo: "/assets/img/avatar.png"
micro_logo: "/assets/img/avatar.png"
social_share_image: "/assets/img/social-share.png"

theme_color: "#18171c"
accent_color: "#ff0073"

permalink: /:title/
excerpt_separator: "<!--more-->"
home_post_limit: 10
show_currently_box: false

intro_box:
  visible: true
  show_avatar: true
  avatar: "/assets/img/avatar.png"
  link_url: "/about/"
  link_label: "Read more about Alex"
  background_color: "#ffbd37"
  text_color: "auto"
  link_color: "#ff0073"
  link_hover_color: "#ffbd37"
  cutout_color: "#18171c"

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      homepage_type: "standard"
      blogpost_type: "standard"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

nav:
  - title: Blog
    url: /blog/
  - title: About
    url: /about/
  - title: Favorites
    url: /favorites/
  - title: Moments
    url: /moments/

mobile_nav:
  - title: Blog
    url: /blog/
  - title: About
    url: /about/
  - title: Favorites
    url: /favorites/
  - title: Moments
    url: /moments/

home_menu:
  - title: About
    url: /about/
  - title: Moments
    url: /moments/
  - title: Colophon
    url: /colophon/
  - title: Contact
    url: /contact/
  - title: Ratings
    url: /ratings/

social_links:
  - title: Threads
    url: "https://www.threads.net/@alexx.fyi"
    icon: "fa-brands fa-threads"
  - title: Bluesky
    url: "https://www.bsky.app/@alxndrr"
    icon: "fa-brands fa-bluesky"
  - title: RSS
    url: "/feed.xml"
    icon: "fa-solid fa-rss"
  - title: Mail
    url: "mailto:hi@alexx.fyi"
    icon: "fa-solid fa-envelope"
